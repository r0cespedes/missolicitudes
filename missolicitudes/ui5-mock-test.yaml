# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: gestionsolicitudes
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /odata
            url: https://api55preview.sapsf.eu
          - path: /cpi
            url: https://integration-suite-desarrollo-zseo5ntm.it-cpi026-rt.cfapps.eu10-002.hana.ondemand.com
            destination: IntegrationSuiteDev
            pathPrefix: /http/des
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: ui5-middleware-servestatic
      afterMiddleware: compression
      mountPath: /user-api
      configuration:
        rootPath: ./webapp/localService/mockdata
    